name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        run: wails build -clean

      - name: Stage artifact
        shell: pwsh
        env:
          ASSET_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $assetBase = 'ime-lock-v2'
          if ($env:ASSET_VERSION) {
            $assetBase = "$assetBase-$($env:ASSET_VERSION)"
          }
          $targetName = "$assetBase-windows-amd64.exe"
          $target = Join-Path 'dist' $targetName
          Copy-Item 'build/bin/ime-lock-v2.exe' $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $targetName" | Set-Content -NoNewline "$target.sha256"

      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: ime-lock-v2-windows-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: ime-lock-v2-windows-amd64
          path: dist

      - name: Verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check "ime-lock-v2-${{ github.ref_name }}-windows-amd64.exe.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
