name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    uses: wanstu/wails-desktop-kit/.github/workflows/wails-desktop.yml@v0.8.0
    with:
      app-name: ime-lock-v2
      desktop-dir: .
      build-windows: true
      build-linux: false
      build-macos: false
      publish-release: ${{ startsWith(github.ref, 'refs/tags/v') }}
